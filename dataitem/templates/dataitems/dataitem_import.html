{% extends 'base.html' %}

{% block title %}Anoteer | Create a Dataitem{% endblock %}
{% block content %}
<h1>{% if form.instance.pk %}Edit{% else %}Create{% endif %} Dataitem</h1>
<form method="post" enctype="multipart/form-data">
  {% csrf_token %}
  {{ form.as_p }}
  <div class="d-flex gap-2 mt-3">
    <button type="submit">Save</button>
    <a href="{% url 'projects:project_detail' project.pk %}" class="btn btn-primary">Zurück</a>
</div>
</form>
{% endblock %}

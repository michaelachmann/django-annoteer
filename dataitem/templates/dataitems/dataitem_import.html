{% extends 'base.html' %}
{% block title %}Anoteer | Dataitem Import{% endblock %}
{% block content %}

<h1>{% if form.instance.pk %}Edit{% else %}Create{% endif %} Dataitem</h1>

<form method="post" enctype="multipart/form-data">
  {% csrf_token %}
  {{ form.as_p }}

  <label for="pasted_data">Or import data from Excel:</label><br>
  <small>Format: <strong>id [separator] text</strong></small><br>
  <pre style="background:#f8f8f8; padding:8px; border:1px solid #ccc;">
    1    Example text
    2    Another text
  </pre>
  <textarea name="pasted_data" rows="10" cols="80"
              placeholder="Paste data"></textarea><br><br>

    <button type="submit">Save</button>
    <a href="{% url 'projects:project_detail' project.pk %}" class="btn btn-primary">Back</a>
</div>
</form>
{% endblock %}
